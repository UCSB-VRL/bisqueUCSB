apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bisque-runtime
  namespace: bisque
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bisque-nginx-config
  namespace: bisque
data:
  default.conf: |
    client_max_body_size 1000000m;
    proxy_read_timeout 5d;
    proxy_send_timeout 5d;
    proxy_request_buffering off;

    server {
        listen 80;

        location = /favicon.ico {
            return 204;
        }

        location = /robots.txt {
            return 200 "User-agent: *\nDisallow: /\n";
        }

        location ^~ /import/transfer {
            client_body_temp_path /var/lib/bisque-upload-tmp;
            client_body_in_file_only clean;
            client_body_buffer_size 16m;

            rewrite ^ /import/transfer_x_file break;
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-File $request_body_file;
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bisque
  namespace: bisque
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bisque
      app.kubernetes.io/part-of: bisque
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bisque
        app.kubernetes.io/part-of: bisque
    spec:
      serviceAccountName: bisque
      initContainers:
        - name: prepare-upload-tmp
          image: busybox:1.36
          command:
            - sh
            - -c
            - chmod 1777 /var/lib/bisque-upload-tmp
          volumeMounts:
            - name: upload-tmp
              mountPath: /var/lib/bisque-upload-tmp
      containers:
        - name: bisque
          image: bisque:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: bisque-config
            - secretRef:
                name: bisque-secret
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: bisque-http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /core/js/bq_api.js
              port: bisque-http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /core/js/bq_api.js
              port: bisque-http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: bisque-runtime
              mountPath: /app/.bisque
            - name: upload-tmp
              mountPath: /var/lib/bisque-upload-tmp
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: proxy-http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: proxy-http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: proxy-http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: upload-tmp
              mountPath: /var/lib/bisque-upload-tmp
      volumes:
        - name: bisque-runtime
          persistentVolumeClaim:
            claimName: bisque-runtime
        - name: nginx-config
          configMap:
            name: bisque-nginx-config
        - name: upload-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bisque
  namespace: bisque
spec:
  selector:
    app.kubernetes.io/name: bisque
    app.kubernetes.io/part-of: bisque
  ports:
    - name: http
      port: 8080
      targetPort: proxy-http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bisque
  namespace: bisque
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
spec:
  ingressClassName: nginx
  rules:
    - host: bisque.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bisque
                port:
                  name: http
