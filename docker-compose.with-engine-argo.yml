# Author: Wahid Sadique Koly
# Date: 2025-Dec-08
# Added necessary configurations to run BisQue with Docker Engine support for modules
# Kept host networking for ease of interservice communication
# Added both Postgres and MySQL services for database flexibility
services:
  vrl-4090.ece.ucsb.edu:
    build: 
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_TAG:-bisque-ucsb-argo:latest}
    container_name: ${CONTAINER_NAME:-bisque-server}
    networks:
      - bisque-net
    extra_hosts:
      - "vrl-4090.ece.ucsb.edu:127.0.0.1"   # resolve vrl hostname to container loopback so in-container calls hit the service
      # - "host.docker.internal:host-gateway"
      # - "vrl-4090.ece.ucsb.edu:172.18.0.1" # get using :  docker network inspect bisque-network --format '{{(index .IPAM.Config 0).Gateway}}'
      - "host.docker.internal:host-gateway"
    volumes:
      # Docker socket for running modules in containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount kubeconfig file to interact with k3s cluster or argo server
      - /home/charvi/bisque_workspace/BisQue-continual-learning/k3s.yaml:/root/.kube/k3s_client.yaml 
      # Preserve configuration directory
      - bisque_config:/source/config
      # Preserve data directory (uploaded files, database, etc.)
      - bisque_data:/source/data
      # Preserve reports directory
      - bisque_reports:/source/reports
      # Preserve public directory (uploaded files accessible via web)
      - bisque_public:/source/public
      # Optional: Mount modules directory if you want to persist custom modules
      # - bisque_modules:/source/modules
      # Optional: Preserve staging directory for uploads
      - bisque_staging:/source/staging
    environment:
      # Server configuration
      BISQUE_SERVER: "${BISQUE_SERVER:-http://vrl-4090.ece.ucsb.edu:8080}"
      BISQUE_ADMIN_EMAIL: "${BISQUE_ADMIN_EMAIL:-admin@yourdomain.com}"
      BISQUE_ADMIN_ID: "${BISQUE_ADMIN_ID:-admin}"
      BISQUE_ORGANIZATION: "${BISQUE_ORGANIZATION:-Your Organization}"
      BISQUE_TITLE: "${BISQUE_TITLE:-BisQue Image Repository}"
      # Optional database override
      BISQUE_DBURL: "${BISQUE_DBURL:-postgresql://bisque:bisqueVRL@postgres:5432/bisque}"
      # Use 127.0.0.1 instead of localhost for MySQL to force TCP connection (not socket)
      # - BISQUE_DBURL=${BISQUE_DBURL:-mysql://bisque:bisque@127.0.0.1:3306/bisque}
      KUBECONFIG: /root/.kube/k3s_client.yaml
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "27000:27000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/image_service/formats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      # mysql:
      #   condition: service_healthy

  # if we want a proper postgres container
  postgres:
    image: postgres:15
    container_name: bisque-postgres
    networks:
      - bisque-net
    environment:
      POSTGRES_DB: bisque
      POSTGRES_USER: bisque
      POSTGRES_PASSWORD: bisqueVRL
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL database (alternative to postgres)
  # mysql:
  #   image: mysql:8.0
  #   container_name: bisque-mysql
  #   network_mode: host
  #   environment:
  #     MYSQL_DATABASE: bisque
  #     MYSQL_USER: bisque
  #     MYSQL_PASSWORD: bisque
  #     MYSQL_ROOT_PASSWORD: rootpassword
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  # Named volumes for persistent data
  bisque_config:
    driver: local
  bisque_data:
    driver: local
  bisque_reports:
    driver: local
  bisque_public:
    driver: local
  # bisque_modules:
  #   driver: local
  bisque_staging:
    driver: local
  postgres_data:
    driver: local
  mysql_data:
    driver: local

networks:
  bisque-net:
    name: ${NETWORK_NAME:-bisque-network}
    driver: bridge
