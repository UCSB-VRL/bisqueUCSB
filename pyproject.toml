[dependency-groups]
dev = [
  "hgtools",
  "pre-commit>=4.6.0",
  "pyinstaller",
  "pylint",
  "pytest>=8.0",
  "ruff>=0.15.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
  "source/bqapi",
  "source/bqcore",
  "source/bqengine",
  "source/bqserver",
]
addopts = [
  "--ignore=source/modules",
  "--ignore=modules",
  "--ignore=source/legacy_upgraded",
  "--ignore=legacy_upgraded",
]
markers = [
  "functional: mark a test as a functional webtest needing a running server",
  "unit: simple unit tests",
  "server: requires a running BisQue server",
  "converter: requires image converter binaries such as imgcnv or Bio-Formats",
  "performance: long-running performance or load tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".bisque",
  ".cache",
  ".flox",
  ".local",
  ".venv",
  "source/legacy_upgraded",
  "source/modules"
]

[tool.ruff.lint]
select = ["I"]

[tool.uv.sources]
bisque-api = { path = "source/bqapi", editable = true }
bqcore = { path = "source/bqcore", editable = true }
bqengine = { path = "source/bqengine", editable = true }
bqserver = { path = "source/bqserver", editable = true }
Minimatic = { path = "source/legacy_upgraded/Minimatic-2.0", editable = true }
Paste = { path = "source/legacy_upgraded/paste-103.10.1", editable = true }
Pylons = { path = "source/legacy_upgraded/Pylons-2.0", editable = true }
pytest-bisque = { path = "source/pytest-bisque", editable = true }
WebError = { path = "source/legacy_upgraded/WebError-2.0", editable = true }
WebHelpers = { path = "source/legacy_upgraded/WebHelpers-2.0", editable = true }
