name: Container Images

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Also push the latest tag"
        required: false
        default: false
        type: boolean

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: "1"

jobs:
  build:
    name: Build and publish images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune --all --force --volumes
          df -h

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names and tags
        shell: bash
        run: |
          set -euo pipefail

          image_namespace="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          flox_hash="${{ hashFiles('.flox/env/manifest.toml', '.flox/env/manifest.lock') }}"
          short_sha="${GITHUB_SHA::12}"

          env_image="${REGISTRY}/${image_namespace}/bisque-env"
          app_image="${REGISTRY}/${image_namespace}/bisque"

          {
            echo "BISQUE_ENV_IMAGE=${env_image}:flox-${flox_hash}"
            echo "BISQUE_IMAGE=${app_image}:sha-${short_sha}"
            echo "ENV_IMAGE=${env_image}"
            echo "APP_IMAGE=${app_image}"
            echo "FLOX_HASH=${flox_hash}"
            echo "SHORT_SHA=${short_sha}"
          } >> "$GITHUB_ENV"

      - name: Pull cached environment image
        id: env-cache
        shell: bash
        run: |
          if docker pull "$BISQUE_ENV_IMAGE"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build environment image
        if: steps.env-cache.outputs.hit != 'true'
        run: scripts/docker-build-env.sh

      - name: Push environment image
        if: steps.env-cache.outputs.hit != 'true'
        run: docker push "$BISQUE_ENV_IMAGE"

      - name: Build BisQue image without Bio-Formats
        run: >
          scripts/docker-build.sh
          --build-arg BISQUE_INSTALL_BIOFORMATS=0

      - name: Smoke test BisQue image
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          export BISQUE_HTTP_PORT=8081

          cleanup() {
            docker compose -f deploy/docker/compose.yml down --volumes --remove-orphans
          }
          trap cleanup EXIT

          if ! docker compose -f deploy/docker/compose.yml up -d --wait; then
            docker compose -f deploy/docker/compose.yml logs --no-color --tail=200
            exit 1
          fi

          curl -fsS -o /dev/null "http://127.0.0.1:${BISQUE_HTTP_PORT}/"
          curl -fsS -o /dev/null "http://127.0.0.1:${BISQUE_HTTP_PORT}/core/js/bq_api.js"
          curl -fsS -o /dev/null "http://127.0.0.1:${BISQUE_HTTP_PORT}/core/css/bq.css"

      - name: Push BisQue image
        run: docker push "$BISQUE_IMAGE"

      - name: Tag branch cache images
        if: github.ref_type == 'branch'
        shell: bash
        run: |
          set -euo pipefail
          branch="$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_.-' '-')"

          docker tag "$BISQUE_ENV_IMAGE" "${ENV_IMAGE}:${branch}"
          docker tag "$BISQUE_IMAGE" "${APP_IMAGE}:${branch}"

          docker push "${ENV_IMAGE}:${branch}"
          docker push "${APP_IMAGE}:${branch}"

      - name: Tag release images
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          docker tag "$BISQUE_IMAGE" "${APP_IMAGE}:${version}"
          docker tag "$BISQUE_IMAGE" "${APP_IMAGE}:${GITHUB_REF_NAME}"

          docker push "${APP_IMAGE}:${version}"
          docker push "${APP_IMAGE}:${GITHUB_REF_NAME}"

      - name: Tag latest images
        if: >
          (github.ref_type == 'branch' &&
          (github.ref_name == 'main' || github.ref_name == 'master')) ||
          (github.event_name == 'workflow_dispatch' && inputs.push_latest)
        run: |
          docker tag "$BISQUE_ENV_IMAGE" "${ENV_IMAGE}:latest"
          docker tag "$BISQUE_IMAGE" "${APP_IMAGE}:latest"

          docker push "${ENV_IMAGE}:latest"
          docker push "${APP_IMAGE}:latest"
