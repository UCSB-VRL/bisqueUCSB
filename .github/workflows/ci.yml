name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Unit and service tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune --all --force --volumes
          df -h

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: .cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync Python environment
        run: flox activate -- uv sync --frozen --group dev

      - name: Run unit tests
        run: flox activate -- scripts/test-unit.sh

      - name: Run stable service tests
        run: flox activate -- scripts/test-services.sh --no-sync data blob table
